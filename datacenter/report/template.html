<title>機房建模基準 Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky section rail on wide screens, top nav on phones; each stage = inputs strip + one column per run. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --sunk: #e9edef; --ink: #15202a; --muted: #5a6772; --line: #d5dce1;
  --accent: #0d6f7d; --ok: #1d7a46; --warn: #a15c00; --bad: #b3261e;
  --c-opus: #5847c9; --c-qh: #0b7d61; --c-qd: #a66a10;
  --code-bg: #f0f3f5;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1417; --surface: #161d21; --sunk: #1d262b; --ink: #e3e9ec; --muted: #94a3ad; --line: #2b363d;
  --accent: #4fb8c6; --ok: #5cc48a; --warn: #e0a24b; --bad: #f08a80;
  --c-opus: #9c8ff5; --c-qh: #49c39f; --c-qd: #e0a24b; --code-bg: #11181c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1417; --surface: #161d21; --sunk: #1d262b; --ink: #e3e9ec; --muted: #94a3ad; --line: #2b363d;
  --accent: #4fb8c6; --ok: #5cc48a; --warn: #e0a24b; --bad: #f08a80;
  --c-opus: #9c8ff5; --c-qh: #49c39f; --c-qd: #e0a24b; --code-bg: #11181c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
nav.rail a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
nav.rail a:hover, nav.rail a:focus-visible { background: var(--sunk); color: var(--ink); outline: none; }
nav.rail .grp { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 10px 4px; font-family: var(--f-mono); }
@media (max-width: 900px) { nav.rail { position: static; flex-direction: row; flex-wrap: wrap; } nav.rail .grp { display: none; } }
main { min-width: 0; display: flex; flex-direction: column; gap: 56px; }
h1 { font-size: 30px; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--muted); }
.mono, code, pre, .num { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
header.top { display: flex; flex-direction: column; gap: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.tog { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
button.tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.tog:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.stage { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 20px; }
.stage-head { display: flex; flex-direction: column; gap: 6px; border-top: 2px solid var(--ink); padding-top: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
.inputs { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.inputs figure { margin: 0; flex: 0 0 auto; width: min(320px, 80vw); }
figure img, .thumbs img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); cursor: zoom-in; }
figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.runs { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; align-items: start; }
.run { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.run-head { padding: 14px 16px 12px; border-top: 4px solid var(--mc); display: flex; flex-direction: column; gap: 10px; }
.run-name { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.run-name h3 { color: var(--mc); }
.run-name .note { font-size: 12px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.kpi { display: flex; flex-direction: column; }
.kpi .v { font-family: var(--f-mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .v.big { font-size: 26px; }
.kpi .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.parts { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; font-size: 12.5px; align-items: center; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--mc); }
.bar i.low { background: var(--warn); }
.parts .pv { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.block { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.block > .lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.thumbs.wide { grid-template-columns: minmax(0, 1fr); }
.thumbs figure { margin: 0; min-width: 0; }
.thumbs figure.span2 { grid-column: 1 / -1; }
.thumbs.small { grid-template-columns: repeat(3, minmax(0, 1fr)); }
details { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
details > summary { cursor: pointer; padding: 7px 10px; font-size: 13px; list-style: none; display: flex; gap: 8px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
details[open] > summary::before { content: "▾"; }
details > .in { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 460px; white-space: pre; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.err { color: var(--bad); border-color: currentColor; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.stepline { font-size: 12.5px; font-family: var(--f-mono); color: var(--muted); padding-left: 2px; }
.path { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .03em; background: var(--sunk); white-space: nowrap; }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--mc); margin-right: 6px; vertical-align: 1px; }
.judges { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.jcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.jcard ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.reason { font-size: 13px; background: var(--sunk); border-radius: 6px; padding: 8px 10px; }
.callout { border-left: 3px solid var(--warn); background: var(--surface); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 80ch; }
.blind-note { font-size: 13px; color: var(--warn); }
dialog#lb { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog#lb::backdrop { background: rgba(8, 12, 14, .82); }
dialog#lb .box { display: flex; flex-direction: column; gap: 8px; align-items: center; }
dialog#lb .imgwrap { max-width: 96vw; max-height: 86vh; overflow: auto; border-radius: 6px; background: #fff; }
dialog#lb img { display: block; max-width: 96vw; max-height: 86vh; cursor: zoom-in; }
dialog#lb img.full { max-width: none; max-height: none; cursor: zoom-out; }
dialog#lb .cap { color: #e8eef0; font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
dialog#lb button { font: inherit; font-size: 13px; background: #e8eef0; color: #111; border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .run, .jcard { transition: border-color .15s; } }
</style>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="章節"></nav>
  <main id="main"></main>
</div>
<dialog id="lb" aria-label="放大圖片"><div class="box"><div class="imgwrap"><img id="lbimg" alt=""></div>
  <div class="cap"><span id="lbcap"></span><button type="button" id="lbfull">原尺寸</button><button type="button" id="lbclose">關閉</button></div></div></dialog>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const MC = { "opus": "var(--c-opus)", "qwen-high": "var(--c-qh)", "qwen-default": "var(--c-qd)" };
const PART_NAMES = {
  racks: "機櫃", room: "房間", columns: "柱子", crah: "CRAH", doors: "門", aisles: "冷熱通道", shell: "Blender 殼體",
  position: "位置", facing: "朝向", height: "高度", ids: "ID 命名", collisions: "無碰撞", containment: "冷通道封閉",
  perf_tiles: "有孔地磚", cable_trays: "線槽", dims_A: "Rack A 尺寸", dims_B: "Rack B 尺寸", placement: "擺放", structure: "命名結構", budget: "面數上限"
};
const PART_MAX = { racks: 50, room: 10, columns: 5, crah: 5, doors: 5, aisles: 10, shell: 15, position: 25, facing: 20, height: 5, ids: 5,
  collisions: 10, containment: 15, perf_tiles: 10, cable_trays: 10, dims_A: 10, dims_B: 10, placement: 5, structure: 10, budget: 5 };
let blind = false;
try { blind = sessionStorage.getItem("blind") === "1"; } catch (e) {}
const BLIND_NAMES = ["作品 甲", "作品 乙", "作品 丙"];
const order = {};  // per-section shuffled order for blind mode
function shuffleFor(id, n) {
  if (!order[id]) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } order[id] = a; }
  return order[id];
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtSec = s => s == null ? "—" : s < 120 ? `${Math.round(s)} 秒` : `${(s / 60).toFixed(1)} 分`;
const fmtCost = c => c == null ? "方案額度" : `$${c.toFixed(3)}`;
const fmtTok = t => { if (!t) return "—"; const v = t.total ?? ((t.prompt || 0) + (t.completion || 0)); return v ? (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v / 1000) + "k") : "—"; };
function scoreOf(r) {
  const s = r.score; if (!s) return null;
  if (s.total != null) return { v: s.total, max: 100 };
  if (s.auto_total_40 != null) return { v: s.auto_total_40, max: 40 };
  return null;
}

function fig(img, cls = "") { return `<figure class="${cls}"><img loading="lazy" src="${esc(img.src)}" alt="${esc(img.cap || img.name || "")}" data-cap="${esc(img.cap || img.name || "")}"><figcaption>${esc(img.cap || img.name || "")}</figcaption></figure>`; }

function runCard(sec, r, i) {
  const m = D.models[r.model];
  const name = blind ? BLIND_NAMES[i] : m.label;
  const color = blind ? "var(--accent)" : MC[r.model];
  const sc = scoreOf(r);
  const parts = r.score && r.score.parts ? Object.entries(r.score.parts) : [];
  const kpis = blind
    ? `<div class="kpis"><div class="kpi"><span class="v big">${sc ? sc.v : "—"}</span><span class="k">自動分 / ${sc ? sc.max : ""}</span></div></div>`
    : `<div class="kpis">
        <div class="kpi"><span class="v big">${sc ? sc.v : "—"}</span><span class="k">自動分 / ${sc ? sc.max : ""}</span></div>
        <div class="kpi"><span class="v">${fmtSec(r.seconds)}</span><span class="k">用時</span></div>
        <div class="kpi"><span class="v">${r.bench_calls ?? "—"}</span><span class="k">計次 bench 呼叫</span></div>
        <div class="kpi"><span class="v">${fmtCost(r.cost)}</span><span class="k">花費 · ${fmtTok(r.tokens)} tok</span></div></div>`;
  const partsHtml = parts.length ? `<div class="parts">${parts.map(([k, v]) => {
      const mx = PART_MAX[k] || 1, pct = Math.max(0, Math.min(100, v / mx * 100));
      return `<span>${esc(PART_NAMES[k] || k)}</span><span class="bar"><i class="${pct < 99.5 ? "low" : ""}" style="width:${pct}%"></i></span><span class="pv">${v}/${mx}</span>`; }).join("")}</div>` : "";
  const review = r.review && r.review.length ? `<div class="block"><span class="lbl">固定視角評審圖（兩邊同一組相機）</span>
      <div class="thumbs ${sec.stage === "s1" ? "" : ""}">${r.review.map((im, k) => fig(im, sec.stage === "s1" && k === 0 ? "span2" : "")).join("")}</div></div>` : "";
  const execs = (r.steps || []).filter(s => s.kind === "exec");
  const steps = blind ? "" : `<div class="block"><span class="lbl">模型自己的過程：${(r.steps || []).length} 個 bench 動作，其中 ${execs.length} 次 exec</span>
      <details><summary>全部步驟順序</summary><div class="in steps">${(r.steps || []).map((s, k) => s.kind === "exec"
        ? `<span class="stepline">${k + 1}. exec ${esc(s.file.split("/").pop())} <span class="pill ${s.ok ? "ok" : "err"}">${s.ok ? "ok" : "error"}</span> ${s.sec ?? ""}s</span>`
        : `<span class="stepline">${k + 1}. ${esc(s.kind)} ${esc(s.args || "")}${s.refused ? ` <span class="pill err">拒絕：${esc(s.refused)}</span>` : ""}</span>`).join("")}</div></details>
      ${execs.map((s, k) => `<details><summary><span class="mono">exec #${k + 1}</span> ${esc(s.file.split("/").pop())} <span class="pill ${s.ok ? "ok" : "err"}">${s.ok ? "ok" : "error"}</span></summary>
        <div class="in"><pre>${esc(s.code)}</pre>${s.out ? `<span class="lbl muted">stdout</span><pre>${esc(s.out)}</pre>` : ""}${s.err ? `<span class="lbl muted">stderr</span><pre>${esc(s.err)}</pre>` : ""}</div></details>`).join("")}</div>`;
  const own = !blind && r.own_renders && r.own_renders.length ? `<div class="block"><details><summary>模型自己做的預覽渲染（共 ${r.own_render_total} 張，顯示 ${r.own_renders.length} 張）</summary>
      <div class="in"><div class="thumbs small">${r.own_renders.map(im => fig({ src: im.src, cap: im.name })).join("")}</div></div></details></div>` : "";
  const lp = !blind && r.layout_pred ? `<div class="block"><details><summary>layout_pred.json（模型的讀圖結果）</summary><div class="in"><pre>${esc(r.layout_pred)}</pre></div></details></div>` : "";
  const path = blind ? "" : `<div class="block"><span class="path">${esc(r.path)} · ${esc((r.files || []).join(", "))}</span></div>`;
  return `<article class="run" style="--mc:${color}"><div class="run-head"><div class="run-name"><h3>${esc(name)}</h3>${blind ? "" : `<span class="note">${esc(m.note)}</span>`}</div>${kpis}${blind ? "" : partsHtml}</div>${review}${steps}${own}${lp}${path}</article>`;
}

function overview() {
  const cols = ["opus", "qwen-high", "qwen-default"];
  const rows = D.sections.map(sec => {
    const cells = cols.map(mk => { const r = sec.runs.find(x => x.model === mk); if (!r) return `<td class="muted">—</td>`;
      const sc = scoreOf(r);
      return `<td class="num"><b>${sc ? sc.v : "—"}</b><span class="muted">/${sc ? sc.max : ""}</span><br><span class="muted">${fmtSec(r.seconds)} · ${r.bench_calls ?? "—"} 次 · ${fmtCost(r.cost)}</span></td>`; }).join("");
    return `<tr><td><a href="#${sec.id}">${esc(sec.title)}</a></td>${cells}</tr>`; }).join("");
  return `<div class="tbl-wrap"><table><thead><tr><th>階段</th>${cols.map(mk => `<th class="num"><span class="swatch" style="--mc:${MC[mk]}"></span>${esc(D.models[mk].label)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:13px">分數是自動計分（S1、S3 滿分 100；S2 只量尺寸、擺放、命名與面數，滿分 40，外觀另看 Gemini 和人工）。時間幾乎全是等模型回應，Blender 在 CPU 上每個 run 只算幾秒。</p>`;
}

function judgeSection() {
  const cards = D.judges.map(j => {
    const abs = Object.entries(j.absolute).map(([n, rows]) => `<tr><td>${esc(n)}</td><td class="num">${rows.map(x => x.pct == null ? "—" : x.pct).join(" / ")}</td><td class="num muted">${rows.map(x => x.raw ?? "—").join(" / ")}</td></tr>`).join("");
    const pw = Object.entries(j.pairwise).map(([k, v]) => `<span class="pill">${esc(k)}：${esc(v)}</span>`).join(" ");
    const flags = Object.entries(j.absolute).flatMap(([n, rows]) => (rows[0]?.flags || []).map(f => `<li><b>${esc(n)}</b>：${esc(f)}</li>`)).join("");
    return `<div class="jcard"><div><span class="eyebrow">${esc(j.stage)}</span><h3>${esc(j.judge)}</h3><span class="path">${esc(j.dir)} · 約 $${j.cost}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>作品</th><th class="num">逐項換算分（各次）</th><th class="num">它自己給的總分</th></tr></thead><tbody>${abs}</tbody></table></div>
      <div>${pw}</div><div class="reason">${esc(j.reason)}</div>${flags ? `<ul>${flags}</ul>` : ""}</div>`; }).join("");
  const ver = D.verify.map(v => `<tr><td>${esc(v.stage)}</td><td>${esc(v.claim)}</td><td>${esc(v.check)}</td></tr>`).join("");
  return `<section class="stage" id="judge"><div class="stage-head"><span class="eyebrow">第二評分</span><h2>Gemini 評審與查證</h2>
      <p class="muted">兩份作品匿名成 X／Y、隨機排序後交給 Gemini，它看不到答案卷和自動分數。下面的作品名稱是事後揭曉的。</p></div>
    <div class="callout">單獨評分可以參考；兩兩比較不可靠：它的四個具體指控經場景檔查證都是錯的，S2 的勝負還會隨對手翻轉。</div>
    <div class="tbl-wrap"><table><thead><tr><th>階段</th><th>Gemini 的說法</th><th>用場景檔查證的結果</th></tr></thead><tbody>${ver}</tbody></table></div>
    <div class="judges">${cards}</div></section>`;
}

function methodSection() {
  return `<section class="stage" id="method"><div class="stage-head"><span class="eyebrow">方法</span><h2>規則與公平性</h2></div><ul class="plain">
    <li>兩個模型只能透過同一支 <code>bench</code> 工具操作無頭 Blender 4.2（exec／render／inspect／save），上限都是每階段 60 次計次呼叫、45 分鐘。Blender 腳本全部由受測模型自己寫，記錄在各 run 的 <code>bench_log.jsonl</code>。</li>
    <li>Qwen 的工具限制由 harness 程式強制：只能執行單一 bench 指令，讀寫只限 run 目錄；圖片縮到長邊 1568 px，與 Claude Code 讀圖一致。</li>
    <li>Opus 是同容器內全新上下文的 Claude Code 子代理，工具限制靠指令。每次它跑的期間，答案卷和 Qwen 的結果都先從磁碟移開，結束後用 seed 重建答案卷並確認與原本相同。Opus 在 S2 自己回報過兩個小違規（一次 Edit、一次沒加引號的重導向），不影響結果。</li>
    <li>推理強度：Opus effort high；Qwen 主要比較用 <code>reasoning.effort = high</code>，供應商預設的 r1 留作參考。</li>
    <li>S3 兩邊拿到相同的起始場景（答案卷的房間殼體＋中立範本機櫃），所以 S3 只考擺放，不被 S1、S2 的錯誤拖累。</li>
    <li>easy 與 hard 的 S1、S3 都已飽和；目前能量到的差距只有效率。</li></ul></section>`;
}

function render() {
  const rail = [`<a href="#top">總覽</a>`, `<span class="grp">階段</span>`, ...D.sections.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`),
    `<span class="grp">評分</span>`, `<a href="#judge">Gemini 評審與查證</a>`, `<a href="#method">規則與公平性</a>`];
  document.getElementById("rail").innerHTML = rail.join("");
  const head = `<header class="top" id="top"><span class="eyebrow">AI 機房 pipeline · Blender 控制 · 2026-11-18</span><h1>機房建模基準 Pilot：Opus 5.5 對 Qwen 3.8 Flash</h1>
    <p class="muted">每一階段都可以並排看兩個模型的作品：固定視角評審圖、模型自己寫的每一支 Blender 腳本與輸出、它自己做的預覽圖、讀圖結果，以及自動計分的細項。點圖片可放大。</p>
    <div class="facts"><span>受測：<b>Opus 5.5</b>（Claude Code）·<b>Qwen 3.8 Flash</b>（OpenRouter）</span><span>第二評分：<b>Gemini 3.8 Flash</b></span><span>情境：<b>easy</b>（16 櫃）·<b>hard</b>（58 櫃）</span></div>
    <div class="toolbar"><button type="button" class="tog" id="blindbtn" aria-pressed="${blind}">${blind ? "盲測中：點此揭曉" : "盲測模式"}</button>
      ${blind ? `<span class="blind-note">作品名稱、用時、花費和過程都已隱藏，順序每次隨機；看完外觀再揭曉。</span>` : ""}</div></header>`;
  const ov = blind ? "" : `<section class="stage"><div class="stage-head"><span class="eyebrow">總覽</span><h2>各階段分數與效率</h2></div>${overview()}</section>`;
  const secs = D.sections.map(sec => {
    const idx = blind ? shuffleFor(sec.id, sec.runs.length) : sec.runs.map((_, i) => i);
    return `<section class="stage" id="${sec.id}"><div class="stage-head"><span class="eyebrow">${esc(sec.stage.toUpperCase())} · ${esc(sec.scenario)}</span><h2>${esc(sec.title)}</h2></div>
      <div class="inputs">${sec.inputs.filter(x => x.src).map(x => fig(x)).join("")}</div>
      <div class="runs">${idx.map((ri, k) => runCard(sec, sec.runs[ri], k)).join("")}</div></section>`; }).join("");
  document.getElementById("main").innerHTML = head + ov + secs + (blind ? "" : judgeSection() + methodSection());
  document.getElementById("blindbtn").addEventListener("click", () => {
    blind = !blind; try { sessionStorage.setItem("blind", blind ? "1" : "0"); } catch (e) {}
    if (blind) for (const k in order) delete order[k];
    render(); });
}
render();

const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
document.addEventListener("click", e => {
  const img = e.target.closest("main img"); if (!img) return;
  lbimg.src = img.src; lbimg.classList.remove("full"); document.getElementById("lbcap").textContent = img.dataset.cap || "";
  document.getElementById("lbfull").textContent = "原尺寸"; lb.showModal();
});
function toggleFull() { const f = lbimg.classList.toggle("full"); document.getElementById("lbfull").textContent = f ? "符合視窗" : "原尺寸"; }
lbimg.addEventListener("click", toggleFull);
document.getElementById("lbfull").addEventListener("click", toggleFull);
document.getElementById("lbclose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
</script>
