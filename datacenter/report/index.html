d(0.5 * ((2*p1) + (-p0+p2)*s + (2*p0-5*p1+4*p2-p3)*s*s +\n                              (-p0+3*p1-3*p2+p3)*s*s*s))\n    out.append(pts[-1])\n    return out\n\ndef add_tube(bm, pts, r, segs=6, steps=6, mi=0):\n    path = catmull([Vector(p) for p in pts], steps)\n    n = len(path)\n    rings = []\n    nn = Vector((0, 0, 1))\n    d0 = (path[1] - path[0]).normalized()\n    if abs(nn.dot(d0)) > 0.95:\n        nn = Vector((1, 0, 0))\n    nn = (nn - d0 * nn.dot(d0)).normalized()\n    for i in range(n):\n        if i == 0:\n            d = (path[1] - path[0]).normalized()\n        elif i == n - 1:\n            d = (path[-1] - path[-2]).normalized()\n        else:\n            d = (path[i+1] - path[i-1]).normalized()\n        nn = (nn - d * nn.dot(d)).normalized()\n        bb = d.cross(nn)\n        ring = []\n        for k in range(segs):\n            a = 2 * math.pi * k / segs\n            ring.append(bm.verts.new(path[i] + nn * math.cos(a) * r + bb * math.sin(a) * r))\n        rings.append(ring)\n    start = len(bm.faces)\n    for i in range(n - 1):\n        for k in range(segs):\n            k2 = (k + 1) % segs\n            bm.faces.new((rings[i][k], rings[i][k2], rings[i+1][k2], rings[i+1][k]))\n    c0 = bm.verts.new(path[0]); c1 = bm.verts.new(path[-1])\n    for k in range(segs):\n        k2 = (k + 1) % segs\n        bm.faces.new((c0, rings[0][k2], rings[0][k]))\n        bm.faces.new((c1, rings[-1][k], rings[-1][k2]))\n    for f in bm.faces[start:]:\n        f.material_index = mi\n\n# =====================================================================\n# RACK A - closed server cabinet, 0.6 x 1.2 x 2.0, centre (0,0), front -y\n# =====================================================================\nRA = empty(\"RackA\", (0, 0, 0))\nbpy.context.view_layer.update()\n\n# --- leveling feet ---\nbm = bmesh.new()\nfor sx in (-1, 1):\n    for sy in (-1, 1):\n        add_cyl(bm, (sx * 0.25, sy * 0.52, 0.025), 0.028, 0.05, 12)\n        add_box(bm, (sx * 0.25, sy * 0.52, 0.055), nts while failing rack orientation), resulting in a tie."}], "verify": [{"stage": "S2", "claim": "Opus 的 Rack A 伺服器高度一致、沒有盲板", "check": "讀 s2.blend：Opus Rack A 有 6 個盲板物件，伺服器高度 1U×11、2U×5、4U×3。判斷錯誤，可能因為前門深色開孔、預覽圖無材質看不清。"}, {"stage": "S3 easy", "claim": "Qwen 的機櫃轉反 180°，背板朝冷通道", "check": "Qwen Rack_A01 旋轉 −180°、B01 0°，與 Opus、參考解相同；頂點質心 A 列偏北、B 列偏南（朝冷通道）。判斷錯誤。"}, {"stage": "S3 easy", "claim": "Opus 完全沒做有孔地磚", "check": "Opus 場景有 16 個 PerfTile_*，0.6×0.6 m、頂面 z = 0.6，計分程式逐格確認。判斷錯誤。"}, {"stage": "S3 hard（程式碼審查）", "claim": "Gemini 4 Carbon：Opus 把 RackG 複本的 root scale 設成 1，蓋掉 1.333 的寬度", "check": "計分程式量到 Opus 的 B01–B03 寬度都是 0.8 m（size_ok），GPU 櫃寬度正確；這個 bug 不成立或沒有影響結果。"}, {"stage": "S2（Gemini 4 Argon）", "claim": "改用 Cycles 評審圖後的判斷", "check": "沒有再出現與場景檔矛盾的指控；兩次評分完全一致（Qwen high 94.2、Opus 93.3、Qwen 預設 89.2），但兩兩比較的排序與單獨評分相反。"}, {"stage": "S1 easy", "claim": "（Gemini 3.8 Flash 自己給的總分約 70）", "check": "同一次評分裡所有項目都判「正確」，總分卻打七折；之後改用逐項判定換算分數。"}], "code": [{"stage": "S3 hard", "model": "gemini-4-carbon", "dir": "datacenter/judge/code-s3-hard/review.json", "cost": 0.535, "reviews": [{"name": "Opus 5.5", "scores": {"spec_compliance": 5, "derives_from_inputs": 5, "self_verification": 5, "code_quality": 4, "efficiency": 5}, "bugs": [{"severity": "medium", "where": "script 1 (build.py, line 74), patched in memory by script 3 (fix.py, line 1398ff.)", "what": "Setting root.scale = (1, 1, 1) overwrote the RackG template root scale of (1.3333, 1.0, 1.0), shrinking the three 800 mm GPU racks (B01, B02, B03) to 600 mm wide; caught by the script's own world bounding-box verification and patched in the live session via exec/replace in script 3, though build.py on disk remained unedited."}, {"severity": "low", "where": "script 1 (build.py, lines 45-56-ish in dup_tree, right before copy_rack) ", "what": "Unused, unfinished helper function dup_tree containing dead 'if False else None' expressions was left in the script instead of being removed."}, {"severity": "low", "where": "script 1 (build.py, inside <script>
const D = JSON.parse(document.getElementById("data").textContent);
const MC = { "opus": "var(--c-opus)", "qwen-high": "var(--c-qh)", "qwen-default": "var(--c-qd)" };
const PART_NAMES = {
  racks: "機櫃", room: "房間", columns: "柱子", crah: "CRAH", doors: "門", aisles: "冷熱通道", shell: "Blender 殼體",
  position: "位置", facing: "朝向", height: "高度", ids: "ID 命名", collisions: "無碰撞", containment: "冷通道封閉",
  perf_tiles: "有孔地磚", cable_trays: "線槽", dims_A: "Rack A 尺寸", dims_B: "Rack B 尺寸", placement: "擺放", structure: "命名結構", budget: "面數上限",
  rack_count: "機櫃數量", rack_position: "機櫃位置", rack_facing: "機櫃朝向", rack_width: "機櫃寬度", cold_aisles: "冷通道"
};
const PART_MAX = { racks: 50, room: 10, columns: 5, crah: 5, doors: 5, aisles: 10, shell: 15, position: 25, facing: 20, height: 5, ids: 5,
  collisions: 10, containment: 15, perf_tiles: 10, cable_trays: 10, dims_A: 10, dims_B: 10, placement: 5, structure: 10, budget: 5,
  rack_count: 15, rack_position: 25, rack_facing: 15, rack_width: 15 };
const PART_MAX_BY_STAGE = { s1p: { crah: 10, cold_aisles: 20 } };
let blind = false;
try { blind = sessionStorage.getItem("blind") === "1"; } catch (e) {}
const BLIND_NAMES = ["作品 甲", "作品 乙", "作品 丙"];
const order = {};  // per-section shuffled order for blind mode
function shuffleFor(id, n) {
  if (!order[id]) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } order[id] = a; }
  return order[id];
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtSec = s => s == null ? "—" : s < 120 ? `${Math.round(s)} 秒` : `${(s / 60).toFixed(1)} 分`;
const fmtCost = c => c == null ? "方案額度" : `$${c.toFixed(3)}`;
const fmtTok = t => { if (!t) return "—"; const v = t.total ?? ((t.prompt || 0) + (t.completion || 0)); return v ? (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v / 1000) + "k") : "—"; };
function scoreOf(r) {
  const s = r.score; if (!s) return null;
  if (s.total != null) return { v: s.total, max: 100 };
  if (s.auto_total_40 != null) return { v: s.auto_total_40, max: 40 };
  return null;
}

function fig(img, cls = "") { return `<figure class="${cls}"><img loading="lazy" src="${esc(img.src)}" alt="${esc(img.cap || img.name || "")}" data-cap="${esc(img.cap || img.name || "")}"><figcaption>${esc(img.cap || img.name || "")}</figcaption></figure>`; }

function runCard(sec, r, i) {
  const m = D.models[r.model];
  const name = blind ? BLIND_NAMES[i] : m.label;
  const color = blind ? "var(--accent)" : MC[r.model];
  const sc = scoreOf(r);
  const parts = r.score && r.score.parts ? Object.entries(r.score.parts) : [];
  const kpis = blind
    ? `<div class="kpis"><div class="kpi"><span class="v big">${sc ? sc.v : "—"}</span><span class="k">${sec.stage === "s2" ? "幾何分（不含外觀）" : "自動分"} / ${sc ? sc.max : ""}</span></div></div>`
    : `<div class="kpis">
        <div class="kpi"><span class="v big">${sc ? sc.v : "—"}</span><span class="k">${sec.stage === "s2" ? "幾何分（不含外觀）" : "自動分"} / ${sc ? sc.max : ""}</span></div>
        <div class="kpi"><span class="v">${fmtSec(r.seconds)}</span><span class="k">用時</span></div>
        <div class="kpi"><span class="v">${r.bench_calls ?? "—"}</span><span class="k">計次 bench 呼叫</span></div>
        <div class="kpi"><span class="v">${fmtCost(r.cost)}</span><span class="k">花費 · ${fmtTok(r.tokens)} tok</span></div></div>`;
  const partsHtml = parts.length ? `<div class="parts">${parts.map(([k, v]) => {
      const mx = (PART_MAX_BY_STAGE[sec.stage] || {})[k] || PART_MAX[k] || 1, pct = Math.max(0, Math.min(100, v / mx * 100));
      return `<span>${esc(PART_NAMES[k] || k)}</span><span class="bar"><i class="${pct < 99.5 ? "low" : ""}" style="width:${pct}%"></i></span><span class="pv">${v}/${mx}</span>`; }).join("")}</div>` : "";
  const review = r.review && r.review.length ? `<div class="block"><span class="lbl">固定視角評審圖（兩邊同一組相機）</span>
      <div class="thumbs ${sec.stage === "s1" ? "" : ""}">${r.review.map((im, k) => fig(im, (sec.stage === "s1" || sec.stage === "s1p") && k === 0 ? "span2" : "")).join("")}</div></div>` : "";
  const execs = (r.steps || []).filter(s => s.kind === "exec");
  const steps = blind ? "" : `<div class="block"><span class="lbl">模型自己的過程：${(r.steps || []).length} 個 bench 動作，其中 ${execs.length} 次 exec</span>
      <details><summary>全部步驟順序</summary><div class="in steps">${(r.steps || []).map((s, k) => s.kind === "exec"
        ? `<span class="stepline">${k + 1}. exec ${esc(s.file.split("/").pop())} <span class="pill ${s.ok ? "ok" : "err"}">${s.ok ? "ok" : "error"}</span> ${s.sec ?? ""}s</span>`
        : `<span class="stepline">${k + 1}. ${esc(s.kind)} ${esc(s.args || "")}${s.refused ? ` <span class="pill err">拒絕：${esc(s.refused)}</span>` : ""}</span>`).join("")}</div></details>
      ${execs.map((s, k) => `<details><summary><span class="mono">exec #${k + 1}</span> ${esc(s.file.split("/").pop())} <span class="pill ${s.ok ? "ok" : "err"}">${s.ok ? "ok" : "error"}</span></summary>
        <div class="in"><pre>${esc(s.code)}</pre>${s.out ? `<span class="lbl muted">stdout</span><pre>${esc(s.out)}</pre>` : ""}${s.err ? `<span class="lbl muted">stderr</span><pre>${esc(s.err)}</pre>` : ""}</div></details>`).join("")}</div>`;
  const own = !blind && r.own_renders && r.own_renders.length ? `<div class="block"><details><summary>模型自己做的預覽渲染（共 ${r.own_render_total} 張，顯示 ${r.own_renders.length} 張）</summary>
      <div class="in"><div class="thumbs small">${r.own_renders.map(im => fig({ src: im.src, cap: im.name })).join("")}</div></div></details></div>` : "";
  const st = !blind && r.structure ? `<div class="block"><details><summary>場景結構統計（依物件名稱統計，僅供參考）</summary><div class="in"><pre>${esc(r.structure)}</pre></div></details></div>` : "";
  const lp = !blind && r.layout_pred ? `<div class="block"><details><summary>layout_pred.json（模型的讀圖結果）</summary><div class="in"><pre>${esc(r.layout_pred)}</pre></div></details></div>` : "";
  const path = blind ? "" : `<div class="block"><span class="path">${esc(r.path)} · ${esc((r.files || []).join(", "))}</span></div>`;
  return `<article class="run" style="--mc:${color}"><div class="run-head"><div class="run-name"><h3>${esc(name)}</h3>${blind ? "" : `<span class="note">${esc(m.note)}</span>`}</div>${kpis}${blind ? "" : partsHtml}</div>${review}${steps}${own}${st}${lp}${path}</article>`;
}

function overview() {
  const cols = ["opus", "qwen-high", "qwen-default"];
  const rows = D.sections.map(sec => {
    const cells = cols.map(mk => { const r = sec.runs.find(x => x.model === mk); if (!r) return `<td class="muted">—</td>`;
      const sc = scoreOf(r);
      return `<td class="num"><b>${sc ? sc.v : "—"}</b><span class="muted">/${sc ? sc.max : ""}</span><br><span class="muted">${fmtSec(r.seconds)} · ${r.bench_calls ?? "—"} 次 · ${fmtCost(r.cost)}</span></td>`; }).join("");
    return `<tr><td><a href="#${sec.id}">${esc(sec.title)}</a>${sec.stage === "s2" ? `<br><span class="muted">分數只量幾何，不含外觀</span>` : ""}</td>${cells}</tr>`; }).join("");
  return `<div class="tbl-wrap"><table><thead><tr><th>階段</th>${cols.map(mk => `<th class="num"><span class="swatch" style="--mc:${MC[mk]}"></span>${esc(D.models[mk].label)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:13px">分數是自動計分（S1、S3、S1P 滿分 100）。S2 的 40 分只量外框尺寸、擺放、命名與面數，<b>完全不評外觀</b>，兩邊都滿分不代表做得像；外觀請看 Cycles 評審圖、Gemini 4 評審與人工盲測。時間幾乎全是等模型回應，Blender 在 CPU 上每個 run 只算幾秒。</p>`;
}

function judgeSection() {
  const cards = D.judges.map(j => {
    const abs = Object.entries(j.absolute).map(([n, rows]) => `<tr><td>${esc(n)}</td><td class="num">${rows.map(x => x.pct == null ? "—" : x.pct).join(" / ")}</td><td class="num muted">${rows.map(x => x.raw ?? "—").join(" / ")}</td></tr>`).join("");
    const pw = Object.entries(j.pairwise).map(([k, v]) => `<span class="pill">${esc(k)}：${esc(v)}</span>`).join(" ");
    const flags = Object.entries(j.absolute).flatMap(([n, rows]) => (rows[0]?.flags || []).map(f => `<li><b>${esc(n)}</b>：${esc(f)}</li>`)).join("");
    return `<div class="jcard"><div><span class="eyebrow">${esc(j.stage)}</span><h3>${esc(j.judge)}</h3><span class="path">${esc(j.dir)} · 約 $${j.cost}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>作品</th><th class="num">逐項換算分（各次）</th><th class="num">它自己給的總分</th></tr></thead><tbody>${abs}</tbody></table></div>
      <div>${pw}</div>${j.pairs && j.pairs.length ? `<ul>${j.pairs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}${j.reason ? `<div class="reason">${esc(j.reason)}</div>` : ""}${flags ? `<ul>${flags}</ul>` : ""}</div>`; }).join("");
  const ver = D.verify.map(v => `<tr><td>${esc(v.stage)}</td><td>${esc(v.claim)}</td><td>${esc(v.check)}</td></tr>`).join("");
  return `<section class="stage" id="judge"><div class="stage-head"><span class="eyebrow">第二評分</span><h2>Gemini 評審與查證</h2>
      <p class="muted">兩份作品匿名成 X／Y、隨機排序後交給 Gemini，它看不到答案卷和自動分數。下面的作品名稱是事後揭曉的。</p></div>
    <div class="callout">單獨評分可以參考；兩兩比較不可靠：它的四個具體指控經場景檔查證都是錯的，S2 的勝負還會隨對手翻轉。</div>
    <div class="tbl-wrap"><table><thead><tr><th>階段</th><th>Gemini 的說法</th><th>用場景檔查證的結果</th></tr></thead><tbody>${ver}</tbody></table></div>
    <div class="judges">${cards}</div></section>`;
}

function codeSection() {
  if (!D.code || !D.code.length) return "";
  const dims = ["spec_compliance", "derives_from_inputs", "self_verification", "code_quality", "efficiency"];
  const dn = { spec_compliance: "符合規格", derives_from_inputs: "從輸入推導", self_verification: "自我檢查", code_quality: "程式品質", efficiency: "效率" };
  const blocks = D.code.map(c => `<div class="jcard"><div><span class="eyebrow">${esc(c.stage)}</span><h3>程式碼審查 · ${esc(c.model)}</h3><span class="path">${esc(c.dir)} · 約 $${c.cost}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>作品</th>${dims.map(d => `<th class="num">${dn[d]}</th>`).join("")}<th class="num">bug 數</th></tr></thead><tbody>
    ${c.reviews.map(r => `<tr><td>${esc(r.name)}</td>${dims.map(d => `<td class="num">${r.scores[d]}</td>`).join("")}<td class="num">${r.bugs.length}</td></tr>`).join("")}</tbody></table></div>
    ${c.pairs.length ? `<ul>${c.pairs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${c.reviews.map(r => `<details><summary>${esc(r.name)}：摘要、優點與 bug</summary><div class="in"><p style="font-size:13px">${esc(r.summary)}</p>
      ${r.strengths.length ? `<ul>${r.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${r.bugs.length ? `<ul>${r.bugs.map(b => `<li><span class="pill ${b.severity === "high" ? "err" : ""}">${esc(b.severity)}</span> ${esc(b.where)}：${esc(b.what)}</li>`).join("")}</ul>` : ""}</div></details>`).join("")}</div>`).join("");
  return `<section class="stage" id="code"><div class="stage-head"><span class="eyebrow">第二評分</span><h2>程式碼審查（Gemini 4 Carbon）</h2>
    <p class="muted">審查者只看到任務說明和每個作品依序執行的 Blender 腳本（含成功與否、輸出摘錄），作品匿名、順序隨機。分數 1–5。</p></div>
    <div class="judges">${blocks}</div></section>`;
}

function methodSection() {
  return `<section class="stage" id="method"><div class="stage-head"><span class="eyebrow">方法</span><h2>規則與公平性</h2></div><ul class="plain">
    <li>兩個模型只能透過同一支 <code>bench</code> 工具操作無頭 Blender 4.2（exec／render／inspect／save），上限都是每階段 60 次計次呼叫、45 分鐘。Blender 腳本全部由受測模型自己寫，記錄在各 run 的 <code>bench_log.jsonl</code>。</li>
    <li>Qwen 的工具限制由 harness 程式強制：只能執行單一 bench 指令，讀寫只限 run 目錄；圖片縮到長邊 1568 px，與 Claude Code 讀圖一致。</li>
    <li>Opus 是同容器內全新上下文的 Claude Code 子代理，工具限制靠指令。每次它跑的期間，答案卷和 Qwen 的結果都先從磁碟移開，結束後用 seed 重建答案卷並確認與原本相同。Opus 在 S2 自己回報過兩個小違規（一次 Edit、一次沒加引號的重導向），不影響結果。</li>
    <li>推理強度：Opus effort high；Qwen 主要比較用 <code>reasoning.effort = high</code>，供應商預設的 r1 留作參考。</li>
    <li>S3 兩邊拿到相同的起始場景（答案卷的房間殼體＋中立範本機櫃），所以 S3 只考擺放，不被 S1、S2 的錯誤拖累。</li>
    <li>easy 與 hard 的 S1、S3 都已飽和；目前能量到的差距只有效率。</li></ul></section>`;
}

function render() {
  const rail = [`<a href="#top">總覽</a>`, `<span class="grp">階段</span>`, ...D.sections.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`),
    `<span class="grp">評分</span>`, `<a href="#judge">Gemini 評審與查證</a>`, `<a href="#code">程式碼審查</a>`, `<a href="#method">規則與公平性</a>`];
  document.getElementById("rail").innerHTML = rail.join("");
  const head = `<header class="top" id="top"><span class="eyebrow">AI 機房 pipeline · Blender 控制 · 2026-11-18</span><h1>機房建模基準 Pilot：Opus 5.5 對 Qwen 3.8 Flash</h1>
    <p class="muted">每一階段都可以並排看兩個模型的作品：固定視角評審圖、模型自己寫的每一支 Blender 腳本與輸出、它自己做的預覽圖、讀圖結果，以及自動計分的細項。點圖片可放大。</p>
    <div class="facts"><span>受測：<b>Opus 5.5</b>（Claude Code）·<b>Qwen 3.8 Flash</b>（OpenRouter）</span><span>第二評分：<b>Gemini 3.8 Flash</b></span><span>情境：<b>easy</b>（16 櫃）·<b>hard</b>（58 櫃）</span></div>
    <div class="toolbar"><button type="button" class="tog" id="blindbtn" aria-pressed="${blind}">${blind ? "盲測中：點此揭曉" : "盲測模式"}</button>
      ${blind ? `<span class="blind-note">作品名稱、用時、花費和過程都已隱藏，順序每次隨機；看完外觀再揭曉。</span>` : ""}</div></header>`;
  const ov = blind ? "" : `<section class="stage"><div class="stage-head"><span class="eyebrow">總覽</span><h2>各階段分數與效率</h2></div>${overview()}</section>`;
  const secs = D.sections.map(sec => {
    const idx = blind ? shuffleFor(sec.id, sec.runs.length) : sec.runs.map((_, i) => i);
    return `<section class="stage" id="${sec.id}"><div class="stage-head"><span class="eyebrow">${esc(sec.stage.toUpperCase())} · ${esc(sec.scenario)}</span><h2>${esc(sec.title)}</h2></div>
      <div class="inputs">${sec.inputs.filter(x => x.src).map(x => fig(x)).join("")}</div>
      <div class="runs">${idx.map((ri, k) => runCard(sec, sec.runs[ri], k)).join("")}</div></section>`; }).join("");
  document.getElementById("main").innerHTML = head + ov + secs + (blind ? "" : judgeSection() + codeSection() + methodSection());
  document.getElementById("blindbtn").addEventListener("click", () => {
    blind = !blind; try { sessionStorage.setItem("blind", blind ? "1" : "0"); } catch (e) {}
    if (blind) for (const k in order) delete order[k];
    render(); });
}
render();

const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
document.addEventListener("click", e => {
  const img = e.target.closest("main img"); if (!img) return;
  lbimg.src = img.src; lbimg.classList.remove("full"); document.getElementById("lbcap").textContent = img.dataset.cap || "";
  document.getElementById("lbfull").textContent = "原尺寸"; lb.showModal();
});
function toggleFull() { const f = lbimg.classList.toggle("full"); document.getElementById("lbfull").textContent = f ? "符合視窗" : "原尺寸"; }
lbimg.addEventListener("click", toggleFull);
document.getElementById("lbfull").addEventListener("click", toggleFull);
document.getElementById("lbclose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
</script>
